<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">楽譜工房</title>
  <desc id="desc">五線譜・TAB譜・コード譜を自由に作成でき、PDF保存と印刷に対応した楽譜用紙作成ツール</desc>

  <defs>
    <pattern id="dot-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#1e4b3b" opacity="0.11"/>
    </pattern>
    <filter id="paper-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17392f" flood-opacity="0.16"/>
    </filter>
    <clipPath id="paper-clip">
      <rect x="720" y="66" width="408" height="498" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f3efe5"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>
  <path d="M0 0h1200v18H0z" fill="#1e4b3b"/>
  <path d="M0 18h1200v5H0z" fill="#b44f25"/>

  <!-- Brand mark -->
  <circle cx="102" cy="101" r="39" fill="#1e4b3b"/>
  <path d="M111 76v45" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="99" cy="122" rx="13" ry="9" transform="rotate(-15 99 122)" fill="#fff"/>
  <text x="160" y="95" fill="#b44f25" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3.5">PRINTABLE MUSIC PAPER</text>
  <path d="M160 114h414" fill="none" stroke="#1e4b3b" stroke-width="2" opacity="0.22"/>

  <!-- Main message -->
  <text x="72" y="232" fill="#182720" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="86" font-weight="700" letter-spacing="5">楽譜工房</text>
  <rect x="73" y="266" width="76" height="6" rx="3" fill="#b44f25"/>
  <text x="72" y="334" fill="#1e4b3b" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="28" font-weight="700">五線譜・TAB譜・コード譜を</text>
  <text x="72" y="378" fill="#1e4b3b" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="28" font-weight="700">自由に作成</text>
  <text x="72" y="422" fill="#58635e" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="19" font-weight="500">好みの用紙を選んで、そのままプレビュー。</text>

  <!-- Feature footer -->
  <g transform="translate(72 501)">
    <rect width="263" height="62" rx="31" fill="#1e4b3b"/>
    <path d="M29 20h25v25H29zM35 20v9h13v-9M35 39h13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="72" y="39" fill="#fff" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" font-weight="700">PDF保存・印刷対応</text>
  </g>

  <!-- Paper preview -->
  <rect x="720" y="66" width="408" height="498" rx="18" fill="#fffdfa" stroke="#d9d3c7" stroke-width="2" filter="url(#paper-shadow)"/>
  <g clip-path="url(#paper-clip)">
    <rect x="720" y="66" width="408" height="56" fill="#1e4b3b"/>
    <circle cx="755" cy="94" r="7" fill="#f3efe5"/>
    <text x="778" y="101" fill="#fff" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" font-weight="700" letter-spacing="1">LIVE PREVIEW</text>
    <rect x="1019" y="84" width="78" height="22" rx="11" fill="#f3efe5" opacity="0.96"/>
    <text x="1058" y="100" text-anchor="middle" fill="#1e4b3b" font-family="Arial, sans-serif" font-size="12" font-weight="700">A4</text>
  </g>

  <!-- Staff sample -->
  <g stroke="#26332d" stroke-width="2" stroke-linecap="round">
    <path d="M759 164h329M759 176h329M759 188h329M759 200h329M759 212h329"/>
    <path d="M816 164v48M950 164v48M1088 164v48" opacity="0.8"/>
  </g>
  <g fill="#1e4b3b">
    <ellipse cx="784" cy="193" rx="9" ry="6" transform="rotate(-18 784 193)"/>
    <rect x="790" y="159" width="3.5" height="35" rx="1.75"/>
    <path d="M792 160c15 2 19 11 11 19 2-8-3-12-11-11z"/>
  </g>
  <text x="759" y="148" fill="#b44f25" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">STAFF</text>

  <!-- TAB sample -->
  <text x="759" y="266" fill="#b44f25" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TAB</text>
  <g stroke="#26332d" stroke-width="1.7" stroke-linecap="round">
    <path d="M790 281h298M790 293h298M790 305h298M790 317h298M790 329h298M790 341h298"/>
    <path d="M889 281v60M988 281v60" opacity="0.75"/>
  </g>
  <text x="757" y="321" fill="#1e4b3b" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">T</text>
  <text x="757" y="334" fill="#1e4b3b" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">A</text>
  <text x="757" y="347" fill="#1e4b3b" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">B</text>

  <!-- Chord diagram -->
  <g transform="translate(758 386)">
    <text x="0" y="0" fill="#b44f25" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DIAGRAM</text>
    <g transform="translate(0 18)" fill="none" stroke="#26332d" stroke-width="1.6">
      <rect width="103" height="92" rx="1"/>
      <path d="M20.6 0v92M41.2 0v92M61.8 0v92M82.4 0v92M0 18.4h103M0 36.8h103M0 55.2h103M0 73.6h103"/>
      <path d="M0 0h103" stroke-width="5"/>
    </g>
    <circle cx="31" cy="45" r="6" fill="#1e4b3b"/>
    <circle cx="72" cy="63" r="6" fill="#1e4b3b"/>
    <circle cx="92" cy="82" r="6" fill="#b44f25"/>
  </g>

  <!-- Keyboard sample -->
  <g transform="translate(891 386)">
    <text x="0" y="0" fill="#b44f25" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">KEYBOARD</text>
    <g transform="translate(0 18)">
      <rect width="197" height="92" rx="2" fill="#fff" stroke="#26332d" stroke-width="1.6"/>
      <g fill="none" stroke="#26332d" stroke-width="1.3">
        <path d="M24.6 0v92M49.2 0v92M73.8 0v92M98.5 0v92M123.1 0v92M147.7 0v92M172.3 0v92"/>
      </g>
      <g fill="#1e4b3b">
        <path d="M17 0h14v54H17zM42 0h14v54H42zM67 0h14v54H67zM116 0h14v54h-14zM141 0h14v54h-14zM166 0h14v54h-14z"/>
      </g>
    </g>
  </g>

  <circle cx="1149" cy="579" r="5" fill="#b44f25"/>
  <circle cx="1167" cy="579" r="5" fill="#1e4b3b" opacity="0.35"/>
</svg>
