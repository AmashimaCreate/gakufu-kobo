<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1e4b3b">
  <title>ページが見つかりません｜楽譜工房</title>
  <link rel="icon" href="https://amashimacreate.github.io/gakufu-kobo/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f3efe5; color: #202925; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    main { width: min(560px, 100%); padding: 44px 34px; border: 1px solid #c7c1b5; border-radius: 18px; background: #fffefa; text-align: center; box-shadow: 0 18px 50px #3d453c1f; }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: #1e4b3b; color: #fff; font-size: 36px; }
    h1 { margin: 0 0 12px; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(28px, 7vw, 42px); }
    p { margin: 0 0 26px; color: #59635e; line-height: 1.7; }
    a { display: inline-block; min-height: 48px; padding: 13px 22px; border-radius: 9px; background: #b44f25; color: #fff; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #1e4b3b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♩</div>
    <h1>ページが見つかりません</h1>
    <p>URLが変更されたか、入力内容が間違っている可能性があります。</p>
    <a href="https://amashimacreate.github.io/gakufu-kobo/">楽譜工房へ戻る</a>
  </main>
</body>
</html>
